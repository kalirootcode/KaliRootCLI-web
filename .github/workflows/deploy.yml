name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js from secrets
        run: |
          cat > js/config.js << EOF
          /**
           * KR-CLI DOMINION - Web Configuration
           * Auto-generated from GitHub Secrets
           */
          const CONFIG = {
              // Supabase
              SUPABASE_URL: '${{ secrets.SUPABASE_URL }}',
              SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}',
              
              // NOWPayments
              NOWPAYMENTS_API_KEY: '${{ secrets.NOWPAYMENTS_API_KEY }}',
              NOWPAYMENTS_IPN_SECRET: '${{ secrets.IPN_SECRET_KEY }}',
              NOWPAYMENTS_API_URL: 'https://api.nowpayments.io/v1',
              
              // PayPal
              PAYPAL_CLIENT_ID: '${{ secrets.PAYPAL_CLIENT_ID }}',
              
              // Backend API URL (Render)
              RENDER_API_URL: '${{ secrets.RENDER_API_URL }}'
          };
          
          window.CONFIG = CONFIG;
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
