<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Curso | KR-CLI DOMINION</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        .course-page {
            padding-top: 80px;
            min-height: 100vh;
            background: #000;
        }

        .course-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .course-header {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .course-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #06b6d4;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .course-back:hover {
            color: #00ff88;
        }

        .course-title-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .course-icon {
            font-size: 3rem;
        }

        .course-title {
            font-family: var(--font-display);
            font-size: 2rem;
            margin: 0;
        }

        .course-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .difficulty-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .difficulty-badge.beginner {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .difficulty-badge.intermediate {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .difficulty-badge.advanced {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .difficulty-badge.expert {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
        }

        .course-description {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        /* Sections */
        .course-section {
            margin-bottom: 40px;
            background: rgba(10, 14, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #06b6d4;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .intro-text {
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .objectives-list {
            list-style: none;
            padding: 0;
        }

        .objectives-list li {
            padding: 10px 0;
            padding-left: 30px;
            position: relative;
            color: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .objectives-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #00ff88;
            font-weight: bold;
        }

        /* Modules */
        .module {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .module-header {
            padding: 20px 25px;
            background: rgba(6, 182, 212, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .module-header h3 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            margin: 0;
        }

        .module-toggle {
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .module.open .module-toggle {
            transform: rotate(180deg);
        }

        .module-content {
            padding: 25px;
            display: none;
        }

        .module.open .module-content {
            display: block;
        }

        /* Sections inside modules */
        .module-section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .module-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .module-section h4 {
            font-family: var(--font-display);
            font-size: 1rem;
            color: #00ff88;
            margin-bottom: 15px;
        }

        .theory-text {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        /* Commands */
        .commands-container {
            margin-bottom: 20px;
        }

        .command-item {
            background: #000;
            border: 1px solid #00ff88;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .command-code {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            font-family: var(--font-mono);
            color: #00ff88;
            font-size: 0.95rem;
        }

        .command-code .prompt {
            color: #ef4444;
            margin-right: 10px;
        }

        .command-explanation {
            padding: 15px 20px;
            background: rgba(0, 255, 136, 0.05);
            border-top: 1px solid rgba(0, 255, 136, 0.3);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        /* Tips */
        .tips-container {
            background: rgba(168, 85, 247, 0.1);
            border-left: 3px solid #a855f7;
            padding: 15px 20px;
            border-radius: 0 8px 8px 0;
        }

        .tips-container h5 {
            color: #a855f7;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .tips-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .tips-list li {
            padding: 5px 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .tips-list li::before {
            content: '💡 ';
        }

        /* Resources */
        .resources-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .resource-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 8px;
            color: #06b6d4;
            text-decoration: none;
            transition: all 0.2s;
        }

        .resource-link:hover {
            background: rgba(6, 182, 212, 0.2);
            border-color: #06b6d4;
        }

        /* Conclusion */
        .conclusion-text {
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.8;
            font-size: 1.05rem;
        }

        /* Loading & Error states */
        .loading-state,
        .error-state {
            text-align: center;
            padding: 100px 20px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(6, 182, 212, 0.2);
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-state h2 {
            color: #ef4444;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .course-title {
                font-size: 1.5rem;
            }

            .course-title-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .course-section {
                padding: 20px;
            }
        }
    </style>
</head>

<body class="course-page">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo.png" alt="KR-CLI" class="logo-img">
                <span class="logo-text">KR-CLI</span>
            </a>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="educacion.html" class="nav-link">🎓 Educación</a></li>
                <li><a href="noticias.html" class="nav-link">📰 Noticias</a></li>
                <li><a href="herramientas.html" class="nav-link">🛠️ Herramientas</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            </ul>
            <button class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <div class="course-container" id="course-container">
        <div class="loading-state" id="loading-state">
            <div class="loading-spinner"></div>
            <p>Cargando curso...</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>KR-CLI DOMINION © 2026 KaliRoot Code</p>
            </div>
        </div>
    </footer>

    <script src="js/api-config.js"></script>
    <script>
        const API_URL = (window.KR_API_CONFIG ? window.KR_API_CONFIG.EDUCATION_API : 'https://kalirootcli.onrender.com') + '/api/education';

        document.addEventListener('DOMContentLoaded', loadCourse);

        async function loadCourse() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!slug) {
                showError('No se especificó el curso');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/ai-course/${slug}`);
                const data = await response.json();

                if (data.success && data.course) {
                    renderCourse(data.course);
                    document.title = `${data.course.title} | KR-CLI DOMINION`;
                } else {
                    showError(data.error || 'Curso no encontrado');
                }
            } catch (error) {
                console.error('Error loading course:', error);
                showError('Error cargando el curso');
            }
        }

        function renderCourse(course) {
            const container = document.getElementById('course-container');
            const content = course.content || {};

            let html = `
                <div class="course-header">
                    <a href="educacion.html" class="course-back">← Volver a Cursos</a>
                    <div class="course-title-row">
                        <span class="course-icon">${course.icon || '📚'}</span>
                        <h1 class="course-title">${course.title}</h1>
                    </div>
                    <div class="course-meta">
                        <span class="meta-item"><span class="difficulty-badge ${course.difficulty}">${course.difficulty}</span></span>
                        <span class="meta-item">⏱️ ${course.duration || '2-4 horas'}</span>
                        <span class="meta-item">👁️ ${course.total_views || 0} vistas</span>
                    </div>
                    <p class="course-description">${course.description || ''}</p>
                </div>
            `;

            // Introduction
            if (content.intro) {
                html += `
                    <div class="course-section">
                        <h2 class="section-title">📖 Introducción</h2>
                        <div class="intro-text">${content.intro}</div>
                    </div>
                `;
            }

            // Objectives
            if (content.objectives && content.objectives.length) {
                html += `
                    <div class="course-section">
                        <h2 class="section-title">🎯 Objetivos del Curso</h2>
                        <ul class="objectives-list">
                            ${content.objectives.map(obj => `<li>${obj}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            // Modules
            if (content.modules && content.modules.length) {
                html += `<div class="course-section"><h2 class="section-title">📚 Módulos</h2>`;

                content.modules.forEach((module, idx) => {
                    html += `
                        <div class="module ${idx === 0 ? 'open' : ''}" id="module-${idx}">
                            <div class="module-header" onclick="toggleModule('module-${idx}')">
                                <h3>${idx + 1}. ${module.title}</h3>
                                <span class="module-toggle">▼</span>
                            </div>
                            <div class="module-content">
                    `;

                    if (module.sections) {
                        module.sections.forEach(section => {
                            html += `
                                <div class="module-section">
                                    <h4>${section.title}</h4>
                                    ${section.theory ? `<div class="theory-text">${section.theory}</div>` : ''}
                            `;

                            if (section.commands && section.commands.length) {
                                html += '<div class="commands-container">';
                                section.commands.forEach(cmd => {
                                    html += `
                                        <div class="command-item">
                                            <div class="command-code">
                                                <span class="prompt">$</span>
                                                <code>${escapeHtml(cmd.command)}</code>
                                            </div>
                                            <div class="command-explanation">${cmd.explanation}</div>
                                        </div>
                                    `;
                                });
                                html += '</div>';
                            }

                            if (section.tips && section.tips.length) {
                                html += `
                                    <div class="tips-container">
                                        <h5>Tips Profesionales</h5>
                                        <ul class="tips-list">
                                            ${section.tips.map(tip => `<li>${tip}</li>`).join('')}
                                        </ul>
                                    </div>
                                `;
                            }

                            html += '</div>';
                        });
                    }

                    html += '</div></div>';
                });

                html += '</div>';
            }

            // Resources
            if (content.resources && content.resources.length) {
                html += `
                    <div class="course-section">
                        <h2 class="section-title">🔗 Recursos</h2>
                        <div class="resources-list">
                            ${content.resources.map(res => `
                                <a href="${res.url}" target="_blank" class="resource-link">
                                    📄 ${res.title}
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Conclusion
            if (content.conclusion) {
                html += `
                    <div class="course-section">
                        <h2 class="section-title">🏁 Conclusión</h2>
                        <div class="conclusion-text">${content.conclusion}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function toggleModule(moduleId) {
            const module = document.getElementById(moduleId);
            if (module) {
                module.classList.toggle('open');
            }
        }

        function showError(message) {
            document.getElementById('course-container').innerHTML = `
                <div class="error-state">
                    <h2>❌ Error</h2>
                    <p>${message}</p>
                    <a href="educacion.html" class="course-back" style="display: inline-block; margin-top: 20px;">← Volver a Cursos</a>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Mobile nav toggle
        document.getElementById('nav-toggle')?.addEventListener('click', () => {
            document.getElementById('nav-menu').classList.toggle('active');
        });
    </script>
</body>

</html>
