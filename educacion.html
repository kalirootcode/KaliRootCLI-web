        /* Category Filter Bar */

        /* Courses Container - now holds category sections */

        /* Category Section */
        .category-section {

        .category-header {
            display: flex;

        .category-header i {

        /* Courses grid inside category */
        .category-courses {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        @media (max-width: 1400px) {
            .category-courses {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1100px) {
            .category-courses {
                grid-template-columns: repeat(3, 1fr);
            }

        @media (max-width: 800px) {
            .category-courses {

            }

        @media (max-width: 500px) {
            .category-courses {
                grid-template-columns: 1fr;
            }

        /* Compact Course Cards with Category Colors */
        .course-card {
            background: linear-gradient(135deg, rgba(var(--cat-rgb, 6, 182, 212), 0.1) 0%, rgba(10, 14, 39, 0.9) 100%);

            position: relative;
            overflow: hidden;

        .course-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;

    <script>
        // Use dynamic config - defaults to production URL
        const API_URL = (window.KR_API_CONFIG ? window.KR_API_CONFIG.EDUCATION_API : 'https://kalirootcli.onrender.com') + '/api/education';
        let currentCourses = [];
        let aiCourses = [];
        let currentLab = null;

        // Load courses on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadAllCourses();
        });

        async function loadAllCourses() {
            const grid = document.getElementById('courses-grid');
            grid.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6);">Cargando cursos...</p>';

            try {
                // Load ONLY published AI courses from the admin panel
                const response = await fetch(`${API_URL}/ai-courses`);
                const data = await response.json();

                if (data.success && data.courses) {
                    // Mark all as AI courses for proper rendering
                    aiCourses = data.courses.map(c => ({ ...c, isAI: true }));
                    renderCourses(aiCourses);
                } else {
                    grid.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6);">No hay cursos publicados aún. Los cursos aparecerán aquí cuando el admin los publique.</p>';
                }
            } catch (error) {
                console.error('Error loading courses:', error);
                grid.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6);">Error cargando cursos. Verifica que el servidor esté activo.</p>';
            }
        }

        async function loadCourses() {
            await loadAllCourses();
        }

        // Course categories
        const CATEGORIES = {
            'reconnaissance': { name: 'Reconocimiento', icon: 'fa-search' },
            'resource-development': { name: 'Desarrollo de Recursos', icon: 'fa-tools' },
            'initial-access': { name: 'Acceso Inicial', icon: 'fa-door-open' },
            'execution': { name: 'Ejecución', icon: 'fa-play' },
            'persistence': { name: 'Persistencia', icon: 'fa-anchor' },
            'privilege-escalation': { name: 'Escalada', icon: 'fa-arrow-up' },
            'defense-evasion': { name: 'Evasión', icon: 'fa-eye-slash' },
            'credential-access': { name: 'Credenciales', icon: 'fa-key' },
            'discovery': { name: 'Descubrimiento', icon: 'fa-binoculars' },
            'lateral-movement': { name: 'Mov. Lateral', icon: 'fa-arrows-alt-h' },
            'collection': { name: 'Recolección', icon: 'fa-database' },
            'exfiltration': { name: 'Exfiltración', icon: 'fa-upload' },
            'forensics': { name: 'Forense', icon: 'fa-microscope' },
            'web-security': { name: 'Web Security', icon: 'fa-globe' },
            'malware-analysis': { name: 'Malware', icon: 'fa-virus' }
        };

        function renderCourses(courses) {
            const container = document.getElementById('courses-grid');

            if (courses.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.6);">No hay cursos disponibles.</p>';
                return;
            }

            // Group courses by category
            const grouped = {};
            courses.forEach(course => {
                const category = course.category || 'reconnaissance';
                if (!grouped[category]) {
                    grouped[category] = [];
                }
                grouped[category].push(course);
            });

            // Render each category section
            let html = '';
            Object.entries(CATEGORIES).forEach(([catKey, catInfo]) => {
                const categoryCourses = grouped[catKey];
                if (!categoryCourses || categoryCourses.length === 0) return;

                html += `
                    <div class="category-section cat-${catKey}">
                        <div class="category-header">
                            <i class="fas ${catInfo.icon}"></i>
                            <h2>${catInfo.name}</h2>
                            <span class="course-count">${categoryCourses.length} cursos</span>
                        </div>
                        <div class="category-courses">
                            ${categoryCourses.map(course => `
                                <a href="curso.html?slug=${course.slug}" class="course-card cat-${catKey}" style="text-decoration: none;">
                                    <div class="course-icon">${course.icon || '📚'}</div>
                                    <h3 class="course-title">${course.title}</h3>
                                    <p class="course-description">${course.description || ''}</p>
                                    <div class="course-meta-row">
                                        <span><i class="fas fa-clock"></i> ${course.duration || '2-4h'}</span>
                                        <span><i class="fas fa-eye"></i> ${course.total_views || 0}</span>
                                    </div>
                                    <div class="view-course-btn">Ver Curso →</div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function loadLab(labId) {
            try {
                const response = await fetch(`${API_URL}/lab/${labId}`);
                const data = await response.json();

                if (data.success) {
                    currentLab = data.lab;
                    renderLab(data.lab);
                    document.getElementById('lab-modal').classList.add('active');
                }
            } catch (error) {
                console.error('Error loading lab:', error);
            }
        }

        function renderLab(lab) {
            const progress = JSON.parse(localStorage.getItem('kr_education_progress') || '{"courses": {}, "labs": {}}');
            const isCompleted = progress.labs[lab.id] || false;

            const content = document.getElementById('lab-content');
            content.innerHTML = `
                <div class="lab-header">
                    <div>
                        <h2 class="lab-title">${lab.title}</h2>
                        <div class="lab-meta">
                            <span>⏱️ ${lab.estimated_time}</span>
                            <span class="course-difficulty ${lab.difficulty}">${lab.difficulty}</span>
                        </div>
                    </div>
                    <button class="lab-close" onclick="closeLab()">×</button>
                </div>
                
                <p style="color: rgba(255,255,255,0.8); margin-bottom: 20px;">${lab.description}</p>
                
                <div class="lab-objectives">
                    <h3>🎯 Objetivos</h3>
                    <ul>
                        ${lab.objectives.map(obj => `<li>${obj}</li>`).join('')}
                    </ul>
                </div>
                
                <div class="lab-steps">
                    <h3 style="font-family: var(--font-display); margin-bottom: 20px;">📋 Pasos</h3>
                    ${lab.steps.map(step => `
                        <div class="lab-step">
                            <div class="step-header">
                                <div class="step-number">${step.step}</div>
                                <h4 class="step-title">${step.title}</h4>
                            </div>
                            <p class="step-description">${step.description}</p>
                            <div class="step-command">
                                <code>${step.command}</code>
                            </div>
                            <p class="step-explanation">💡 ${step.explanation}</p>
                        </div>
                    `).join('')}
                </div>
                
                <div class="lab-resources">
                    <h3>📚 Recursos Adicionales</h3>
                    ${lab.resources.map(res => `
                        <a href="${res.url}" target="_blank" class="resource-link">🔗 ${res.title}</a>
                    `).join('')}
                </div>
                
                <button class="lab-complete-btn ${isCompleted ? 'completed' : ''}" onclick="toggleLabComplete('${lab.id}')">
                    ${isCompleted ? '✅ Laboratorio Completado' : '✓ Marcar como Completado'}
                </button>
            `;
        }

        function closeLab() {
            document.getElementById('lab-modal').classList.remove('active');
        }

        function toggleLabComplete(labId) {
            const progress = JSON.parse(localStorage.getItem('kr_education_progress') || '{"courses": {}, "labs": {}}');
            progress.labs[labId] = !progress.labs[labId];
            localStorage.setItem('kr_education_progress', JSON.stringify(progress));

            // Re-render lab
            if (currentLab) {
                renderLab(currentLab);
            }

            // Re-render courses to update progress
            if (currentCourses.length > 0) {
                renderCourses(currentCourses);
            }
        }

        // Close modal on outside click
        document.getElementById('lab-modal').addEventListener('click', (e) => {
            if (e.target.id === 'lab-modal') {
                closeLab();
            }
        });

        // Nav Time Update
        function updateNavTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('es-ES', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            const timeElement = document.getElementById('nav-time');
            if (timeElement) {
                timeElement.textContent = timeString;
            }
        }
        updateNavTime();
        setInterval(updateNavTime, 1000);
    </script>
    <script src="js/cyber-menu.js"></script>
</body>

</html>
