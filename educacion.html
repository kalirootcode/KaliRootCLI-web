<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Educación | KR-CLI DOMINION</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        .education-page {
            padding-top: 80px;
            min-height: 100vh;
        }

        .education-hero {
            padding: 60px 0 40px;
            background: linear-gradient(180deg, rgba(6, 182, 212, 0.1) 0%, transparent 100%);
            text-align: center;
        }

        .education-hero h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .education-hero p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .courses-section {
            padding: 40px 0;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .course-card {
            background: rgba(10, 14, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .course-card:hover {
            transform: translateY(-5px);
            border-color: #06b6d4;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
        }

        .course-card.beginner {
            border-left: 4px solid #00ff88;
        }

        .course-card.intermediate {
            border-left: 4px solid #fbbf24;
        }

        .course-card.advanced {
            border-left: 4px solid #ef4444;
        }

        .course-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .course-icon {
            font-size: 2.5rem;
        }

        .course-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            margin: 0;
        }

        .course-difficulty {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .course-difficulty.beginner {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .course-difficulty.intermediate {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .course-difficulty.advanced {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .course-description {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .course-progress {
            margin-bottom: 15px;
        }

        .course-progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.6);
        }

        .course-modules {
            margin-top: 20px;
        }

        .module-item {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .module-name {
            font-size: 0.9rem;
        }

        .module-labs {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .lab-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            overflow-y: auto;
            padding: 20px;
        }

        .lab-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lab-content {
            background: #0a0e27;
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        .lab-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 30px;
        }

        .lab-close {
            background: none;
            border: none;
            color: #8892b0;
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .lab-close:hover {
            color: #00ff88;
        }

        .lab-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .lab-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .lab-objectives {
            background: rgba(6, 182, 212, 0.1);
            border-left: 3px solid #06b6d4;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .lab-objectives h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #06b6d4;
        }

        .lab-objectives ul {
            margin-left: 20px;
        }

        .lab-objectives li {
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
        }

        .lab-steps {
            margin-bottom: 30px;
        }

        .lab-step {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .step-number {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
        }

        .step-title {
            font-family: var(--font-display);
            font-size: 1.1rem;
        }

        .step-description {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .step-command {
            background: #000;
            border: 1px solid #00ff88;
            border-radius: 8px;
            padding: 15px;
            font-family: var(--font-mono);
            color: #00ff88;
            margin-bottom: 10px;
            position: relative;
        }

        .step-command code {
            display: block;
        }

        .step-explanation {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
        }

        .lab-resources {
            background: rgba(168, 85, 247, 0.1);
            border-left: 3px solid #a855f7;
            padding: 20px;
            border-radius: 8px;
        }

        .lab-resources h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #a855f7;
        }

        .resource-link {
            display: block;
            color: #06b6d4;
            margin-bottom: 8px;
            text-decoration: none;
        }

        .resource-link:hover {
            color: #00ff88;
        }

        .lab-complete-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }

        .lab-complete-btn:hover {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }

        .lab-complete-btn.completed {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 2px solid #00ff88;
        }
    </style>
</head>

<body class="education-page">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo.png" alt="KR-CLI" class="logo-img">
                <span class="logo-text">KR-CLI</span>
            </a>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="educacion.html" class="nav-link">🎓 Educación</a></li>
                <li><a href="noticias.html" class="nav-link">📰 Noticias</a></li>
                <li><a href="herramientas.html" class="nav-link">🛠️ Herramientas</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            </ul>
            <button class="nav-toggle" id="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="education-hero">
        <div class="container">
            <h1>🎓 Academia de Ciberseguridad</h1>
            <p>Aprende hacking ético desde cero con laboratorios prácticos y sin censura</p>
        </div>
    </section>

    <!-- Courses -->
    <section class="courses-section">
        <div class="container">
            <div class="courses-grid" id="courses-grid">
                <!-- Courses will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Lab Modal -->
    <div class="lab-modal" id="lab-modal">
        <div class="lab-content" id="lab-content">
            <!-- Lab content will be loaded here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>KR-CLI DOMINION © 2026 KaliRoot Code</p>
            </div>
        </div>
    </footer>

    <script src="js/api-config.js"></script>
    <script>
        // Use dynamic config - defaults to production URL
        const API_URL = (window.KR_API_CONFIG ? window.KR_API_CONFIG.EDUCATION_API : 'https://kalirootcli.onrender.com') + '/api/education';
        let currentCourses = [];
        let currentLab = null;

        // Load courses on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadCourses();
        });

        async function loadCourses() {
            try {
                const response = await fetch(`${API_URL}/courses`);
                const data = await response.json();

                if (data.success) {
                    currentCourses = data.courses;
                    renderCourses(data.courses);
                }
            } catch (error) {
                console.error('Error loading courses:', error);
                document.getElementById('courses-grid').innerHTML =
                    '<p style="text-align: center; color: rgba(255,255,255,0.6);">Error cargando cursos. Verifica que el servidor esté activo.</p>';
            }
        }

        function renderCourses(courses) {
            const grid = document.getElementById('courses-grid');
            const progress = JSON.parse(localStorage.getItem('kr_education_progress') || '{"courses": {}, "labs": {}}');

            grid.innerHTML = courses.map(course => {
                const courseProgress = progress.courses[course.id] || 0;

                return `
                    <div class="course-card ${course.difficulty}">
                        <div class="course-header">
                            <span class="course-icon">${course.icon}</span>
                            <div>
                                <h3 class="course-title">${course.title}</h3>
                                <span class="course-difficulty ${course.difficulty}">${course.difficulty}</span>
                            </div>
                        </div>
                        <p class="course-description">${course.description}</p>
                        <div class="course-progress">
                            <div class="course-progress-label">
                                <span>Progreso</span>
                                <span>${courseProgress}%</span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar" style="width: ${courseProgress}%"></div>
                            </div>
                        </div>
                        <div class="course-modules">
                            ${course.modules.map(module => `
                                <div class="module-item">
                                    <span class="module-name">${module.title}</span>
                                    <span class="module-labs">${module.labs.length} labs</span>
                                </div>
                                ${module.labs.map(labId => `
                                    <button onclick="loadLab('${labId}')" style="width: 100%; padding: 8px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); border-radius: 6px; color: #06b6d4; cursor: pointer; margin-bottom: 5px; font-size: 0.85rem;">
                                        📝 ${labId.replace('lab_', '').replace(/_/g, ' ').toUpperCase()}
                                    </button>
                                `).join('')}
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function loadLab(labId) {
            try {
                const response = await fetch(`${API_URL}/lab/${labId}`);
                const data = await response.json();

                if (data.success) {
                    currentLab = data.lab;
                    renderLab(data.lab);
                    document.getElementById('lab-modal').classList.add('active');
                }
            } catch (error) {
                console.error('Error loading lab:', error);
            }
        }

        function renderLab(lab) {
            const progress = JSON.parse(localStorage.getItem('kr_education_progress') || '{"courses": {}, "labs": {}}');
            const isCompleted = progress.labs[lab.id] || false;

            const content = document.getElementById('lab-content');
            content.innerHTML = `
                <div class="lab-header">
                    <div>
                        <h2 class="lab-title">${lab.title}</h2>
                        <div class="lab-meta">
                            <span>⏱️ ${lab.estimated_time}</span>
                            <span class="course-difficulty ${lab.difficulty}">${lab.difficulty}</span>
                        </div>
                    </div>
                    <button class="lab-close" onclick="closeLab()">×</button>
                </div>
                
                <p style="color: rgba(255,255,255,0.8); margin-bottom: 20px;">${lab.description}</p>
                
                <div class="lab-objectives">
                    <h3>🎯 Objetivos</h3>
                    <ul>
                        ${lab.objectives.map(obj => `<li>${obj}</li>`).join('')}
                    </ul>
                </div>
                
                <div class="lab-steps">
                    <h3 style="font-family: var(--font-display); margin-bottom: 20px;">📋 Pasos</h3>
                    ${lab.steps.map(step => `
                        <div class="lab-step">
                            <div class="step-header">
                                <div class="step-number">${step.step}</div>
                                <h4 class="step-title">${step.title}</h4>
                            </div>
                            <p class="step-description">${step.description}</p>
                            <div class="step-command">
                                <code>${step.command}</code>
                            </div>
                            <p class="step-explanation">💡 ${step.explanation}</p>
                        </div>
                    `).join('')}
                </div>
                
                <div class="lab-resources">
                    <h3>📚 Recursos Adicionales</h3>
                    ${lab.resources.map(res => `
                        <a href="${res.url}" target="_blank" class="resource-link">🔗 ${res.title}</a>
                    `).join('')}
                </div>
                
                <button class="lab-complete-btn ${isCompleted ? 'completed' : ''}" onclick="toggleLabComplete('${lab.id}')">
                    ${isCompleted ? '✅ Laboratorio Completado' : '✓ Marcar como Completado'}
                </button>
            `;
        }

        function closeLab() {
            document.getElementById('lab-modal').classList.remove('active');
        }

        function toggleLabComplete(labId) {
            const progress = JSON.parse(localStorage.getItem('kr_education_progress') || '{"courses": {}, "labs": {}}');
            progress.labs[labId] = !progress.labs[labId];
            localStorage.setItem('kr_education_progress', JSON.stringify(progress));

            // Re-render lab
            if (currentLab) {
                renderLab(currentLab);
            }

            // Re-render courses to update progress
            if (currentCourses.length > 0) {
                renderCourses(currentCourses);
            }
        }

        // Close modal on outside click
        document.getElementById('lab-modal').addEventListener('click', (e) => {
            if (e.target.id === 'lab-modal') {
                closeLab();
            }
        });
    </script>
</body>

</html>
