<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en tu cuenta y accede a tus productos digitales.">
    <title>Iniciar Sesión | KR Digital Store</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #0066FF;
            --primary-light: #3399FF;
            --primary-dark: #0044AA;
            --secondary: #00FFFF;
            --accent-cyan: #00CCCC;
            --neon-green: #00FF88;
            --bg-dark: #000000;
            --bg-card: #0d0d0d;
            --bg-input: #1a1a1a;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: rgba(0, 255, 255, 0.2);
            --error: #EF4444;
            --success: #00FF88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 80% 20%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 80%, rgba(0, 255, 255, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            animation: float 25s infinite ease-in-out;
        }

        .shape-1 {
            width: 350px;
            height: 350px;
            background: var(--primary);
            bottom: -150px;
            right: -100px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 250px;
            height: 250px;
            background: var(--secondary);
            top: -100px;
            left: -50px;
            animation-delay: -8s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                transform: translate(40px, -40px) rotate(5deg);
            }

            66% {
                transform: translate(-30px, 30px) rotate(-5deg);
            }
        }

        /* Auth Container */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
        }

        /* Logo */
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo img {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
            }

            50% {
                filter: drop-shadow(0 0 30px rgba(0, 102, 255, 0.8));
            }
        }

        .auth-logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 15px;
        }

        /* Card */
        .auth-card {
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(0, 255, 255, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Welcome back message */
        .welcome-back {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            color: #6EE7B7;
            font-size: 0.9rem;
        }

        .welcome-back.show {
            display: flex;
        }

        /* Form */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: var(--bg-input);
            border: 2px solid transparent;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(124, 58, 237, 0.1);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }

        .form-input:focus+.icon {
            opacity: 1;
        }

        /* Remember & Forgot */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .remember-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .remember-check label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 0.875rem;
            color: var(--primary-light);
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: var(--secondary);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        .btn-submit.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
        }

        .divider span {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Social Login */
        .social-login {
            display: flex;
            gap: 12px;
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-social:hover {
            background: rgba(124, 58, 237, 0.1);
            border-color: var(--primary);
        }

        .btn-social svg {
            width: 20px;
            height: 20px;
        }

        /* Footer Links */
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-footer p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            color: var(--secondary);
        }

        /* Alert Messages */
        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .alert.show {
            display: flex;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6EE7B7;
        }

        /* Back to Home */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: var(--primary-light);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 24px;
            }

            .auth-header h2 {
                font-size: 1.5rem;
            }

            .social-login {
                flex-direction: column;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="auth-container">
        <a href="index.html" class="back-home">
            ← Volver al inicio
        </a>

        <div class="auth-logo">
            <img src="assets/logo.png" alt="KR Digital">
            <h1>KR DIGITAL</h1>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <h2>Bienvenido de nuevo</h2>
                <p>Ingresa a tu cuenta para continuar</p>
            </div>

            <div id="welcome-message" class="welcome-back">
                <span>✅</span>
                <span>¡Cuenta creada! Ahora inicia sesión.</span>
            </div>

            <div id="alert-box" class="alert">
                <span id="alert-icon">⚠️</span>
                <span id="alert-message"></span>
            </div>

            <form id="login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com"
                            required autocomplete="email">
                        <span class="icon">✉️</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Tu contraseña" required autocomplete="current-password">
                        <span class="icon">🔒</span>
                    </div>
                </div>

                <div class="form-options">
                    <div class="remember-check">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Recordarme</label>
                    </div>
                    <a href="recuperar.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-submit" id="btn-login">
                    <span class="btn-text">Iniciar sesión</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="auth-footer">
                <p>¿No tienes cuenta? <a href="register.html">Crear cuenta gratis</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        // Check for registration redirect
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === 'true') {
            document.getElementById('welcome-message').classList.add('show');
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Form elements
        const form = document.getElementById('login-form');
        const btnSubmit = document.getElementById('btn-login');
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        const alertIcon = document.getElementById('alert-icon');

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberInput = document.getElementById('remember');

        // Show alert
        function showAlert(message, type = 'error') {
            alertBox.className = `alert alert-${type} show`;
            alertMessage.textContent = message;
            alertIcon.textContent = type === 'error' ? '⚠️' : '✅';
        }

        // Hide alert
        function hideAlert() {
            alertBox.classList.remove('show');
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAlert('Por favor completa todos los campos');
                return;
            }

            // Show loading state
            btnSubmit.classList.add('loading');
            btnSubmit.disabled = true;

            try {
                // Initialize Supabase
                console.log('[Login] Initializing Supabase...');
                const client = await window.KRSupabase.init();

                if (!client) {
                    throw new Error('No se pudo conectar con el servidor');
                }

                console.log('[Login] Attempting login for:', email);

                // Sign in with Supabase Auth
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                console.log('[Login] Response:', { data, error });

                if (error) {
                    console.error('[Login] Supabase error:', error);
                    throw error;
                }

                if (!data || !data.user) {
                    throw new Error('No se recibieron datos del usuario');
                }

                console.log('[Login] User authenticated:', data.user.id);

                // Get user data from cli_users
                const userData = await window.KRSupabase.getUserData(data.user.id);
                console.log('[Login] User data from DB:', userData);

                // Store user in session
                const user = {
                    id: data.user.id,
                    email: data.user.email,
                    username: userData?.username || email.split('@')[0],
                    credit_balance: userData?.credit_balance ?? 0,
                    subscription_status: userData?.subscription_status || 'free',
                    subscription_expiry_date: userData?.subscription_expiry_date || null
                };

                // Remember me - use localStorage instead of sessionStorage
                if (rememberInput.checked) {
                    localStorage.setItem('kr_user', JSON.stringify(user));
                } else {
                    sessionStorage.setItem('kr_user', JSON.stringify(user));
                }

                // Log activity (don't wait)
                window.KRSupabase.logActivity(user.id, 'web_login', '/login.html', {
                    source: 'web_form',
                    remember: rememberInput.checked
                }).catch(e => console.warn('Activity log failed:', e));

                // Show success
                showAlert('¡Bienvenido! Redirigiendo...', 'success');

                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('[Login] Error completo:', error);

                let message = 'Error: ' + (error.message || 'Error desconocido');

                // Mensajes más específicos
                if (error.message?.includes('Invalid login credentials')) {
                    message = '❌ Correo o contraseña incorrectos.';
                } else if (error.message?.includes('Email not confirmed')) {
                    message = '📧 Debes verificar tu correo electrónico primero.';
                } else if (error.message?.includes('rate limit')) {
                    message = '⏱ Demasiados intentos. Espera unos minutos.';
                } else if (error.message?.includes('network') || error.message?.includes('fetch')) {
                    message = '🌐 Error de conexión. Verifica tu internet.';
                }

                showAlert(message);
            } finally {
                btnSubmit.classList.remove('loading');
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>

</html>
