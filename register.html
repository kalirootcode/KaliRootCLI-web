<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta y accede a nuestra tienda de recursos digitales exclusivos.">
    <title>Crear Cuenta | KR Digital Store</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #0066FF;
            --primary-light: #3399FF;
            --primary-dark: #0044AA;
            --secondary: #00FFFF;
            --accent-cyan: #00CCCC;
            --neon-green: #00FF88;
            --bg-dark: #000000;
            --bg-card: #0d0d0d;
            --bg-input: #1a1a1a;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: rgba(0, 255, 255, 0.2);
            --error: #EF4444;
            --success: #00FF88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(0, 102, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 255, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 102, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: var(--secondary);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            background: var(--primary-light);
            top: 50%;
            right: 20%;
            animation-delay: -10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            25% {
                transform: translate(30px, -30px) rotate(5deg);
            }

            50% {
                transform: translate(-20px, 20px) rotate(-5deg);
            }

            75% {
                transform: translate(20px, 10px) rotate(3deg);
            }
        }

        /* Auth Container */
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
        }

        /* Logo */
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo img {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.5));
            }

            50% {
                filter: drop-shadow(0 0 30px rgba(0, 102, 255, 0.8));
            }
        }

        .auth-logo h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 15px;
        }

        /* Card */
        .auth-card {
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(0, 255, 255, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Form */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: var(--bg-input);
            border: 2px solid transparent;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(124, 58, 237, 0.1);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }

        .form-input:focus+.icon,
        .form-input:not(:placeholder-shown)+.icon {
            opacity: 1;
        }

        .form-input.error {
            border-color: var(--error);
        }

        .form-input.success {
            border-color: var(--success);
        }

        .error-message {
            font-size: 0.8rem;
            color: var(--error);
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Password Strength */
        .password-strength {
            margin-top: 8px;
        }

        .strength-bar {
            height: 4px;
            background: var(--bg-input);
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-fill.weak {
            width: 33%;
            background: var(--error);
        }

        .strength-fill.medium {
            width: 66%;
            background: #F59E0B;
        }

        .strength-fill.strong {
            width: 100%;
            background: var(--success);
        }

        .strength-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Terms */
        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .terms-check input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
            margin-top: 2px;
        }

        .terms-check label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
            line-height: 1.5;
        }

        .terms-check a {
            color: var(--primary-light);
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        .btn-submit.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
        }

        .divider span {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Social Login */
        .social-login {
            display: flex;
            gap: 12px;
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-social:hover {
            background: rgba(124, 58, 237, 0.1);
            border-color: var(--primary);
        }

        .btn-social svg {
            width: 20px;
            height: 20px;
        }

        /* Footer Links */
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .auth-footer p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .auth-footer a:hover {
            color: var(--secondary);
        }

        /* Alert Messages */
        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert.show {
            display: flex;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6EE7B7;
        }

        /* Back to Home */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: var(--primary-light);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 24px;
            }

            .auth-header h2 {
                font-size: 1.5rem;
            }

            .social-login {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Auth Loader -->
    <div id="auth-loader" style="
        position: fixed; inset: 0; background: #050505; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.3s ease;">
        <div style="text-align: center;">
            <i class="fas fa-shield-alt" style="font-size: 3rem; color: #0066FF; margin-bottom: 20px; animation: pulse 1.5s infinite;"></i>
            <div style="font-family: 'Orbitron'; font-size: 1.5rem; color: #0066FF; margin-bottom: 10px;">KR-CLIDN</div>
            <div style="color: #666; font-size: 0.9rem;">Verificando sesión...</div>
        </div>
    </div>

    <div class="bg-gradient"></div>
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="auth-container">
        <a href="index.html" class="back-home">
            ← Volver al inicio
        </a>

        <div class="auth-logo">
            <img src="assets/logo.png" alt="KR Digital">
            <h1>KR DIGITAL</h1>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <h2>Crea tu cuenta</h2>
                <p>Únete y accede a recursos exclusivos</p>
            </div>

            <div id="alert-box" class="alert">
                <span id="alert-icon">⚠️</span>
                <span id="alert-message"></span>
            </div>

            <form id="register-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" class="form-input"
                            placeholder="Tu nombre único" required autocomplete="username">
                        <span class="icon">👤</span>
                    </div>
                    <div class="error-message" id="username-error"></div>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com"
                            required autocomplete="email">
                        <span class="icon">✉️</span>
                    </div>
                    <div class="error-message" id="email-error"></div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
                        <span class="icon">🔒</span>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <div class="strength-text" id="strength-text"></div>
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>

                <div class="form-group">
                    <label for="password-confirm">Confirmar contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password-confirm" name="password-confirm" class="form-input"
                            placeholder="Repite tu contraseña" required autocomplete="new-password">
                        <span class="icon">🔐</span>
                    </div>
                    <div class="error-message" id="confirm-error"></div>
                </div>

                <div class="form-group">
                    <div class="terms-check">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">
                            Acepto los <a href="terminos.html">Términos de Servicio</a>
                            y la <a href="privacidad.html">Política de Privacidad</a>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btn-register">
                    <span class="btn-text">Crear cuenta</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        const authLoader = document.getElementById('auth-loader');

        function hideLoader() {
            if (authLoader) {
                authLoader.style.opacity = '0';
                setTimeout(() => {
                    authLoader.style.display = 'none';
                }, 300);
            }
        }

        // Check if user is already logged in - redirect to dashboard
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const storedUser = localStorage.getItem('kr_user') || sessionStorage.getItem('kr_user');
                if (storedUser) {
                    await new Promise(r => setTimeout(r, 500));
                    window.location.href = 'dashboard.html';
                    return;
                }
                
                try {
                    await window.KRSupabase.init();
                    const session = await window.KRSupabase.getSession();
                    if (session?.user) {
                        await new Promise(r => setTimeout(r, 500));
                        window.location.href = 'dashboard.html';
                        return;
                    }
                } catch(e) {
                    console.log('Supabase check failed');
                }

                hideLoader();
            } catch (e) {
                console.log('No active session');
                hideLoader();
            }
        });

        // Form elements
        const form = document.getElementById('register-form');
        const btnSubmit = document.getElementById('btn-register');
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        const alertIcon = document.getElementById('alert-icon');

        // Input fields
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('password-confirm');
        const termsInput = document.getElementById('terms');

        // Password strength indicator
        const strengthFill = document.getElementById('strength-fill');
        const strengthText = document.getElementById('strength-text');

        // Validate username
        function validateUsername(username) {
            if (!username) return 'El nombre de usuario es requerido';
            if (username.length < 3) return 'Mínimo 3 caracteres';
            if (username.length > 20) return 'Máximo 20 caracteres';
            if (!/^[a-zA-Z0-9_]+$/.test(username)) return 'Solo letras, números y guiones bajos';
            return '';
        }

        // Validate email
        function validateEmail(email) {
            if (!email) return 'El correo es requerido';
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) return 'Correo inválido';
            return '';
        }

        // Check password strength
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            return strength;
        }

        // Update password strength UI
        function updatePasswordStrength() {
            const password = passwordInput.value;
            const strength = checkPasswordStrength(password);

            strengthFill.className = 'strength-fill';

            if (password.length === 0) {
                strengthText.textContent = '';
                return;
            }

            if (strength <= 1) {
                strengthFill.classList.add('weak');
                strengthText.textContent = '🔴 Débil - añade mayúsculas, números o símbolos';
            } else if (strength <= 2) {
                strengthFill.classList.add('medium');
                strengthText.textContent = '🟡 Media - casi ahí';
            } else {
                strengthFill.classList.add('strong');
                strengthText.textContent = '🟢 Fuerte - ¡Excelente!';
            }
        }

        // Validate password
        function validatePassword(password) {
            if (!password) return 'La contraseña es requerida';
            if (password.length < 8) return 'Mínimo 8 caracteres';
            return '';
        }

        // Show field error
        function showFieldError(inputId, message) {
            const input = document.getElementById(inputId);
            const errorEl = document.getElementById(inputId + '-error') ||
                document.getElementById(inputId.replace('password-confirm', 'confirm') + '-error');

            if (message) {
                input.classList.add('error');
                input.classList.remove('success');
                if (errorEl) {
                    errorEl.textContent = message;
                    errorEl.classList.add('show');
                }
            } else {
                input.classList.remove('error');
                input.classList.add('success');
                if (errorEl) {
                    errorEl.classList.remove('show');
                }
            }
        }

        // Show alert
        function showAlert(message, type = 'error') {
            alertBox.className = `alert alert-${type} show`;
            alertMessage.textContent = message;
            alertIcon.textContent = type === 'error' ? '⚠️' : '✅';
        }

        // Hide alert
        function hideAlert() {
            alertBox.classList.remove('show');
        }

        // Password input listener
        passwordInput.addEventListener('input', updatePasswordStrength);

        // Real-time validation
        usernameInput.addEventListener('blur', () => {
            showFieldError('username', validateUsername(usernameInput.value));
        });

        emailInput.addEventListener('blur', () => {
            showFieldError('email', validateEmail(emailInput.value));
        });

        passwordInput.addEventListener('blur', () => {
            showFieldError('password', validatePassword(passwordInput.value));
        });

        confirmInput.addEventListener('blur', () => {
            const error = confirmInput.value !== passwordInput.value ? 'Las contraseñas no coinciden' : '';
            showFieldError('password-confirm', error);
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            // Validate all fields
            const usernameError = validateUsername(usernameInput.value);
            const emailError = validateEmail(emailInput.value);
            const passwordError = validatePassword(passwordInput.value);
            const confirmError = confirmInput.value !== passwordInput.value ? 'Las contraseñas no coinciden' : '';

            showFieldError('username', usernameError);
            showFieldError('email', emailError);
            showFieldError('password', passwordError);
            showFieldError('password-confirm', confirmError);

            if (!termsInput.checked) {
                showAlert('Debes aceptar los términos y condiciones');
                return;
            }

            if (usernameError || emailError || passwordError || confirmError) {
                showAlert('Por favor corrige los errores del formulario');
                return;
            }

            // Show loading state
            btnSubmit.classList.add('loading');
            btnSubmit.disabled = true;

            try {
                // Initialize Supabase
                await window.KRSupabase.init();

                // Register user with Supabase Auth
                const { data, error } = await supabaseClient.auth.signUp({
                    email: emailInput.value,
                    password: passwordInput.value,
                    options: {
                        data: {
                            username: usernameInput.value,
                            source: 'web_register'
                        }
                    }
                });

                if (error) throw error;

                // Create user record in cli_users table
                if (data.user) {
                    const { error: insertError } = await supabaseClient
                        .from('cli_users')
                        .insert({
                            id: data.user.id,
                            email: emailInput.value,
                            username: usernameInput.value,
                            subscription_status: 'free',
                            credit_balance: 10, // Welcome credits
                            created_at: new Date().toISOString()
                        });

                    if (insertError && !insertError.message.includes('duplicate')) {
                        console.warn('User insert warning:', insertError);
                    }
                }

                // Show success
                showAlert('¡Cuenta creada! Revisa tu correo para verificar.', 'success');

                // Redirect after delay
                setTimeout(() => {
                    window.location.href = 'login.html?registered=true';
                }, 2000);

            } catch (error) {
                console.error('Registration error:', error);

                let message = 'Error al crear la cuenta. Inténtalo de nuevo.';
                if (error.message.includes('already registered')) {
                    message = 'Este correo ya está registrado. ¿Quieres iniciar sesión?';
                } else if (error.message.includes('invalid email')) {
                    message = 'El correo electrónico no es válido.';
                } else if (error.message.includes('password')) {
                    message = 'La contraseña no cumple los requisitos de seguridad.';
                }

                showAlert(message);
            } finally {
                btnSubmit.classList.remove('loading');
                btnSubmit.disabled = false;
            }
        });
    </script>
</body>

</html>
