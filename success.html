<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Compra Exitosa! | KR Digital Store</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #A78BFA;
            --secondary: #06B6D4;
            --accent-green: #10B981;
            --bg-dark: #000000;
            --bg-card: #1A1A2E;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: rgba(124, 58, 237, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-container {
            text-align: center;
            max-width: 600px;
        }

        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--accent-green), #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 4rem;
            animation: pop 0.5s ease;
            box-shadow: 0 20px 60px rgba(16, 185, 129, 0.4);
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .success-message {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.7;
        }

        .order-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .order-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .order-number {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-light);
            margin-bottom: 20px;
        }

        .order-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            text-align: left;
        }

        .info-item label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .info-item span {
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            background: rgba(124, 58, 237, 0.1);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="success-container">
        <div class="success-icon">✓</div>

        <h1>¡Pago Confirmado!</h1>

        <p class="success-message">
            Tu compra ha sido procesada exitosamente.
            Ya puedes acceder a tus productos digitales desde tu cuenta.
        </p>

        <div class="order-card">
            <div class="order-label">Número de Orden</div>
            <div class="order-number" id="order-number">#KR-000000</div>

            <div class="order-info">
                <div class="info-item">
                    <label>Estado</label>
                    <span style="color: var(--accent-green);">✓ Completado</span>
                </div>
                <div class="info-item">
                    <label>Fecha</label>
                    <span id="order-date">-</span>
                </div>
                <div class="info-item">
                    <label>Método de Pago</label>
                    <span>Criptomoneda</span>
                </div>
                <div class="info-item">
                    <label>Email de Confirmación</label>
                    <span id="order-email">-</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <a href="dashboard.html#downloads" class="btn btn-primary">
                📥 Ir a Mis Descargas
            </a>
            <a href="tienda.html" class="btn btn-secondary">
                🛒 Seguir Comprando
            </a>
        </div>
    </div>

    <script>
        // Get order ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');

        // Load order details
        async function loadOrder() {
            if (!orderId) return;

            try {
                // You could fetch order details here
                document.getElementById('order-number').textContent = `#KR-${orderId.slice(0, 6).toUpperCase()}`;
                document.getElementById('order-date').textContent = new Date().toLocaleDateString('es-ES');

                // Get user email from session
                const user = JSON.parse(sessionStorage.getItem('kr_user') || localStorage.getItem('kr_user') || '{}');
                if (user.email) {
                    document.getElementById('order-email').textContent = user.email;
                }
            } catch (e) {
                console.error('Error loading order:', e);
            }
        }

        // Create confetti
        function createConfetti() {
            const colors = ['#7C3AED', '#06B6D4', '#10B981', '#EC4899', '#F97316'];

            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 5000);
            }
        }

        loadOrder();
        createConfetti();
    </script>
</body>

</html>
