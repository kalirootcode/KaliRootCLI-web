<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Tienda de recursos digitales: ebooks, programas y bundles exclusivos para potenciar tus habilidades.">
    <title>Tienda | KR Digital Store</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #7C3AED;
            --primary-light: #A78BFA;
            --primary-dark: #5B21B6;
            --secondary: #06B6D4;
            --accent-pink: #EC4899;
            --accent-green: #10B981;
            --accent-orange: #F97316;
            --bg-dark: #0F0F1A;
            --bg-card: #1A1A2E;
            --bg-input: #252542;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: rgba(124, 58, 237, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo img {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 10px rgba(124, 58, 237, 0.5));
        }

        .nav-logo span {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--primary-light);
        }

        .nav-cart {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid var(--primary);
            border-radius: 10px;
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-cart:hover {
            background: var(--primary);
            color: white;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            background: var(--accent-pink);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
        }

        .mobile-menu-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--primary);
            margin: 4px 0;
        }

        /* Hero Section */
        .store-hero {
            padding: 140px 30px 80px;
            text-align: center;
            background:
                radial-gradient(ellipse at 30% 0%, rgba(124, 58, 237, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 100%, rgba(6, 182, 212, 0.15) 0%, transparent 50%);
        }

        .store-hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--text-primary), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .store-hero p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 12px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-tab:hover {
            border-color: var(--primary);
            color: var(--primary-light);
        }

        .category-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-color: transparent;
            color: white;
        }

        /* Main Content */
        .store-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px 80px;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        /* Product Card */
        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 25px 50px rgba(124, 58, 237, 0.2);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            z-index: 5;
        }

        .badge-featured {
            background: linear-gradient(135deg, var(--accent-orange), #ea580c);
            color: white;
        }

        .badge-sale {
            background: linear-gradient(135deg, var(--accent-pink), #be185d);
            color: white;
        }

        .badge-new {
            background: linear-gradient(135deg, var(--accent-green), #059669);
            color: white;
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--bg-input), var(--bg-card));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-image .placeholder-icon {
            font-size: 4rem;
            opacity: 0.3;
        }

        .product-category {
            position: absolute;
            bottom: 10px;
            right: 10px;
            padding: 5px 12px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--secondary);
        }

        .product-content {
            padding: 25px;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .product-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .feature-tag {
            padding: 4px 10px;
            background: rgba(124, 58, 237, 0.15);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--primary-light);
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .product-price {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .price-current {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .price-original {
            font-size: 1rem;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .btn-add-cart {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add-cart:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
        }

        .btn-add-cart.added {
            background: linear-gradient(135deg, var(--accent-green), #059669);
        }

        /* Loading State */
        .products-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state .icon {
            font-size: 5rem;
            opacity: 0.3;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--text-muted);
        }

        /* Cart Sidebar */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .cart-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            max-width: 100%;
            height: 100%;
            background: var(--bg-card);
            z-index: 2001;
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-header h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .cart-close:hover {
            color: var(--primary-light);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: var(--bg-input);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .cart-item-image {
            width: 60px;
            height: 60px;
            background: var(--bg-card);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .cart-item-price {
            color: var(--accent-green);
            font-weight: 700;
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .cart-item-remove:hover {
            color: #EF4444;
        }

        .cart-empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .cart-empty .icon {
            font-size: 4rem;
            opacity: 0.3;
            margin-bottom: 15px;
        }

        .cart-footer {
            padding: 25px;
            border-top: 1px solid var(--border-color);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .cart-total span {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .cart-total strong {
            font-size: 1.5rem;
            color: var(--accent-green);
        }

        .btn-checkout {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-green), #059669);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-checkout:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        }

        .btn-checkout:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer */
        .store-footer {
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .store-hero h1 {
                font-size: 2rem;
            }

            .store-hero p {
                font-size: 1rem;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo.png" alt="KR Digital">
                <span>KR DIGITAL</span>
            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="tienda.html" class="nav-link" style="color: var(--primary-light);">Tienda</a>
                <a href="dashboard.html" class="nav-link">Mi Cuenta</a>
                <a href="#" class="nav-cart" onclick="toggleCart()">
                    🛒 Carrito
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>

            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="store-hero">
        <h1>Tienda Digital</h1>
        <p>Recursos exclusivos para potenciar tus habilidades. Ebooks, programas y bundles diseñados para llevarte al
            siguiente nivel.</p>

        <div class="category-tabs">
            <button class="category-tab active" data-category="all">🏪 Todos</button>
            <button class="category-tab" data-category="ebook">📚 Ebooks</button>
            <button class="category-tab" data-category="program">💻 Programas</button>
            <button class="category-tab" data-category="bundle">📦 Bundles</button>
            <button class="category-tab" data-category="course">🎓 Cursos</button>
        </div>
    </section>

    <!-- Products -->
    <main class="store-main">
        <div class="products-grid" id="products-grid">
            <div class="products-loading">
                <div class="loader"></div>
            </div>
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>🛒 Tu Carrito</h2>
            <button class="cart-close" onclick="toggleCart()">✕</button>
        </div>

        <div class="cart-items" id="cart-items">
            <div class="cart-empty">
                <div class="icon">🛒</div>
                <p>Tu carrito está vacío</p>
            </div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <strong id="cart-total">$0.00</strong>
            </div>
            <button class="btn-checkout" id="btn-checkout" disabled onclick="goToCheckout()">
                Proceder al Pago
            </button>
        </div>
    </aside>

    <!-- Footer -->
    <footer class="store-footer">
        <p>© 2026 KR Digital. Todos los derechos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        // State
        let products = [];
        let cart = [];
        let currentCategory = 'all';
        let currentUser = null;

        // DOM Elements
        const productsGrid = document.getElementById('products-grid');
        const cartItems = document.getElementById('cart-items');
        const cartCount = document.getElementById('cart-count');
        const cartTotal = document.getElementById('cart-total');
        const btnCheckout = document.getElementById('btn-checkout');
        const categoryTabs = document.querySelectorAll('.category-tab');

        // Initialize
        async function init() {
            await loadProducts();
            loadCartFromStorage();
            setupCategoryTabs();
            checkAuth();
        }

        // Check authentication
        async function checkAuth() {
            try {
                await window.KRSupabase.init();
                const session = await window.KRSupabase.getSession();
                if (session?.user) {
                    currentUser = session.user;
                }
            } catch (e) {
                console.log('Not authenticated');
            }
        }

        // Load products
        async function loadProducts() {
            try {
                await window.KRSupabase.init();
                products = await window.KRSupabase.getProducts();
                renderProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                // Show demo products if API fails
                products = getDemoProducts();
                renderProducts();
            }
        }

        // Demo products fallback
        function getDemoProducts() {
            return [
                {
                    id: '1',
                    name: 'Guía Completa de Hacking Ético',
                    slug: 'guia-hacking-etico',
                    short_description: 'Domina las técnicas de pentesting desde cero hasta nivel avanzado.',
                    price: 49.99,
                    sale_price: 29.99,
                    category: 'ebook',
                    features: ['📖 +300 páginas', '🔬 15 labs', '🛠️ Scripts incluidos'],
                    is_featured: true
                },
                {
                    id: '2',
                    name: 'Pack Automatización Python',
                    slug: 'pack-automatizacion-python',
                    short_description: 'Scripts profesionales para automatizar tareas de seguridad.',
                    price: 79.99,
                    sale_price: null,
                    category: 'program',
                    features: ['🐍 +50 scripts', '📝 Docs completa', '💻 Soporte'],
                    is_featured: true
                },
                {
                    id: '3',
                    name: 'Bundle Maestro Ciberseguridad',
                    slug: 'bundle-maestro-ciberseguridad',
                    short_description: 'Todo lo que necesitas para dominar la ciberseguridad.',
                    price: 199.99,
                    sale_price: 149.99,
                    category: 'bundle',
                    features: ['📚 Todo incluido', '🎬 +20h video', '🏆 Certificado'],
                    is_featured: true
                }
            ];
        }

        // Render products
        function renderProducts() {
            const filtered = currentCategory === 'all'
                ? products
                : products.filter(p => p.category === currentCategory);

            if (filtered.length === 0) {
                productsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📦</div>
                        <h3>No hay productos</h3>
                        <p>No encontramos productos en esta categoría.</p>
                    </div>
                `;
                return;
            }

            productsGrid.innerHTML = filtered.map(product => {
                const features = Array.isArray(product.features)
                    ? product.features.slice(0, 3)
                    : [];

                const hasDiscount = product.sale_price && product.sale_price < product.price;
                const displayPrice = hasDiscount ? product.sale_price : product.price;

                return `
                    <article class="product-card">
                        ${product.is_featured ? '<span class="product-badge badge-featured">⭐ Destacado</span>' : ''}
                        ${hasDiscount && !product.is_featured ? '<span class="product-badge badge-sale">🔥 Oferta</span>' : ''}
                        
                        <div class="product-image">
                            ${product.image_url
                        ? `<img src="${product.image_url}" alt="${product.name}">`
                        : `<span class="placeholder-icon">${getCategoryIcon(product.category)}</span>`
                    }
                            <span class="product-category">${product.category}</span>
                        </div>
                        
                        <div class="product-content">
                            <h3 class="product-title">${product.name}</h3>
                            <p class="product-description">${product.short_description || ''}</p>
                            
                            <div class="product-features">
                                ${features.map(f => `<span class="feature-tag">${stripEmoji(f)}</span>`).join('')}
                            </div>
                            
                            <div class="product-footer">
                                <div class="product-price">
                                    <span class="price-current">$${displayPrice.toFixed(2)}</span>
                                    ${hasDiscount ? `<span class="price-original">$${product.price.toFixed(2)}</span>` : ''}
                                </div>
                                <button class="btn-add-cart" onclick="addToCart('${product.id}')">
                                    🛒 Añadir
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // Helper functions
        function getCategoryIcon(category) {
            const icons = {
                ebook: '📚',
                program: '💻',
                bundle: '📦',
                course: '🎓'
            };
            return icons[category] || '📦';
        }

        function stripEmoji(text) {
            return text.replace(/[\u{1F600}-\u{1F64F}]|[\u{1F300}-\u{1F5FF}]|[\u{1F680}-\u{1F6FF}]|[\u{1F1E0}-\u{1F1FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu, '').trim();
        }

        // Category tabs
        function setupCategoryTabs() {
            categoryTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    categoryTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    renderProducts();
                });
            });
        }

        // Cart functions
        function loadCartFromStorage() {
            const saved = localStorage.getItem('kr_cart');
            if (saved) {
                cart = JSON.parse(saved);
                updateCartUI();
            }
        }

        function saveCartToStorage() {
            localStorage.setItem('kr_cart', JSON.stringify(cart));
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                // Already in cart, show feedback
                showNotification('Ya está en tu carrito', 'info');
                return;
            }

            cart.push({
                id: product.id,
                name: product.name,
                price: product.sale_price || product.price,
                image: product.image_url
            });

            saveCartToStorage();
            updateCartUI();
            showNotification('¡Añadido al carrito!', 'success');

            // Animate button
            const btn = event.target;
            btn.classList.add('added');
            btn.textContent = '✓ Añadido';
            setTimeout(() => {
                btn.classList.remove('added');
                btn.innerHTML = '🛒 Añadir';
            }, 1500);
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCartToStorage();
            updateCartUI();
        }

        function updateCartUI() {
            // Update count
            cartCount.textContent = cart.length;

            // Update cart items
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="cart-empty">
                        <div class="icon">🛒</div>
                        <p>Tu carrito está vacío</p>
                    </div>
                `;
                btnCheckout.disabled = true;
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-image">
                            ${item.image ? `<img src="${item.image}" alt="">` : '📦'}
                        </div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                        </div>
                        <button class="cart-item-remove" onclick="removeFromCart('${item.id}')">🗑️</button>
                    </div>
                `).join('');
                btnCheckout.disabled = false;
            }

            // Update total
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            cartTotal.textContent = `$${total.toFixed(2)}`;
        }

        function toggleCart() {
            const overlay = document.getElementById('cart-overlay');
            const sidebar = document.getElementById('cart-sidebar');
            overlay.classList.toggle('open');
            sidebar.classList.toggle('open');
        }

        function goToCheckout() {
            if (!currentUser) {
                showNotification('Inicia sesión para continuar', 'warning');
                setTimeout(() => {
                    window.location.href = 'login.html?redirect=tienda.html';
                }, 1000);
                return;
            }
            window.location.href = 'checkout.html';
        }

        // Notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                padding: 15px 30px;
                background: ${type === 'success' ? '#10B981' : type === 'warning' ? '#F59E0B' : '#7C3AED'};
                color: white;
                border-radius: 10px;
                font-weight: 600;
                z-index: 3000;
                animation: slideUp 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 2500);
        }

        // Add animation keyframes
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideUp {
                from { transform: translate(-50%, 100px); opacity: 0; }
                to { transform: translate(-50%, 0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        // Initialize on load
        init();
    </script>
</body>

</html>
